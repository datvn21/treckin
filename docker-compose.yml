version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database - Optimized for memory
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: treckin-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_dev_pwd}
      POSTGRES_DB: ${DB_NAME:-treckin_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Optimize Postgres parameters for lower memory usage (approx 100-150MB RAM limit)
    command: >
      postgres 
      -c max_connections=50 
      -c shared_buffers=128MB 
      -c work_mem=4MB 
      -c maintenance_work_mem=32MB 
      -c effective_cache_size=256MB
    # postgres is NOT exposed to host — only accessible within the Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  # -------------------------------------------------------------
  # Redis Cache & Socket Adapter - Optimized for memory
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: treckin-redis
    restart: always
    # Limit Redis memory usage to 128MB and auto-evict using LRU when full
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    # redis is NOT exposed to host — only accessible within the Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M

  # -------------------------------------------------------------
  # NestJS Backend API
  # -------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: treckin-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres_dev_pwd}@postgres:5432/${DB_NAME:-treckin_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-me}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:-your-hmac-secret-key-change-me}
      QR_TTL_SECONDS: ${QR_TTL_SECONDS:-30}
      CORS_ORIGIN: http://localhost # Served via Nginx on port 80
      # Limit node memory footprint
      NODE_OPTIONS: "--max-old-space-size=512"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  # -------------------------------------------------------------
  # Vite React Frontend + Nginx (Reverse Proxy & Static Server)
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: treckin-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pgdata:
